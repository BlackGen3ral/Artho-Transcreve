<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artho Transcreve</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div><h1>Artho Transcreve</h1><p>TikTok</p></div>
    </header>

    <section class="capture" aria-label="Estado da captura">
      <div class="state"><span class="dot" aria-hidden="true"></span><strong id="state">Aguardando</strong></div>
      <p id="hint" role="status">Abra o TikTok e dê play para começar.</p>
      <div class="signal"><span>Nível de áudio</span><meter id="level" min="0" max="100" value="0" aria-label="Nível de áudio"></meter></div>
    </section>

    <form>
      <details id="pair">
        <summary>Código do app</summary>
        <label class="sr-only" for="code">Código de conexão do app</label>
        <input type="password" id="code" maxlength="32" placeholder="Cole o código copiado no Windows" autocomplete="off" spellcheck="false">
      </details>
      <button id="start" type="submit" disabled>Iniciar captura</button>
      <button id="stop" type="button" hidden>Finalizar captura</button>
    </form>
  </main>
  <script src="popup.js"></script>
</body>
</html>
